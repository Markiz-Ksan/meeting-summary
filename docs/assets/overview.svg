<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Сводка последних минут поверх встречи</title><desc id="desc">Иллюстрация: внутренний звук или микрофон обрабатываются локально, а три пункта сводки показываются в прозрачном окне.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d1828"/><stop offset="1" stop-color="#152e3e"/></linearGradient><linearGradient id="accent" x2="1" y2="1"><stop stop-color="#53bcff"/><stop offset="1" stop-color="#51e1c6"/></linearGradient></defs>
<rect width="1200" height="420" rx="24" fill="url(#bg)"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
<rect x="48" y="42" width="172" height="28" rx="14" fill="#173e50"/><text x="67" y="61" font-size="13" fill="#a2f2e0">ЛОКАЛЬНО НА MAC</text>
<text x="48" y="130" font-size="39" font-weight="650" fill="#f4f8fc">Краткая сводка</text><text x="48" y="181" font-size="39" font-weight="650" fill="#f4f8fc">поверх встречи</text>
<text x="50" y="227" font-size="18" fill="#a7bacb">Последние пять минут — в окне.</text><text x="50" y="256" font-size="18" fill="#a7bacb">Полная расшифровка — в отдельном TXT.</text>
<rect x="48" y="317" width="124" height="34" rx="9" fill="#203d50"/><text x="65" y="339" font-size="14" fill="#e0eff8">Звук Mac</text><rect x="184" y="317" width="124" height="34" rx="9" fill="#203d50"/><text x="202" y="339" font-size="14" fill="#e0eff8">Микрофон</text><text x="328" y="340" font-size="20" fill="#53d1db">→</text><text x="367" y="339" font-size="14" fill="#a7bacb">MLX · без облака</text>
<rect x="630" y="67" width="515" height="285" rx="18" fill="#ffffff" fill-opacity=".035" stroke="#b7deec" stroke-opacity=".16"/>
<path d="M659 90h23m-23 7h16m-16 7h10" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/><text x="699" y="104" font-size="14" fill="#a4c3d4">Сводка последних минут</text>
<g fill="#f2f7fb" font-size="20"><text x="659" y="163">• Встреча назначена на пятницу.</text><text x="659" y="207">• Анна проверит смету до среды.</text><text x="659" y="251">• Дата запуска пока не согласована.</text></g>
<text x="660" y="314" font-size="13" fill="#8ca9bd">Пример интерфейса · искусственные данные</text>
<text x="49" y="391" font-size="12" fill="#7895aa">Тестовая версия 0.6.4 · macOS / Apple Silicon · CC0 для собственного кода</text>
