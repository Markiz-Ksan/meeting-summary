name: Software checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Software-only regressions
        run: PYTHON=python3 /bin/sh scripts/check.sh
      - name: Compile without installation or recording
        run: MEETING_BUILD_ONLY=1 /bin/sh build.sh
