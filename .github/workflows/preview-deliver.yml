name: Attach BUILD ONLY preview to existing private build18 draft
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Build-only platform; no model or device validation
        type: choice
        options: [macos, linux]
        required: true
      source_run_id:
        description: Exact successful source build run ID
        type: string
        required: true
      artifact_id:
        description: Exact platform artifact ID from that run
        type: string
        required: true
      expected_sha256:
        description: Exact wrapper ZIP SHA-256 (64 lowercase hexadecimal characters)
        type: string
        required: true
      expected_head:
        description: Exact source main commit (40 lowercase hexadecimal characters)
        type: string
        required: true
permissions: {}
concurrency:
  group: private-build18-preview-delivery
  cancel-in-progress: false
jobs:
  attach-preview:
    if: github.repository == 'Markiz-Ksan/meeting-summary' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            scripts/deliver_preview.py
            tests/test_deliver_preview.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Offline synthetic preview-delivery safeguards
        run: python3 -m unittest discover -s tests -p test_deliver_preview.py -v
      - name: Attach build preview only; never create, edit or publish a release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLATFORM: ${{ inputs.platform }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          python3 scripts/deliver_preview.py --platform "$PLATFORM" \
            --run-id "$SOURCE_RUN_ID" --artifact-id "$ARTIFACT_ID" \
            --sha256 "$EXPECTED_SHA256" --head "$EXPECTED_HEAD"
